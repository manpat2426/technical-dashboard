name: Daily Technical Dashboard Run

on:
  schedule:
    # 00:11 UTC = 7:11 PM EST / 8:11 PM EDT -- roughly 3-4 hours after the
    # 4:00 PM ET market close, year-round. Deliberately off the top of the
    # hour (minute 11, not 0) since GitHub documents -- and we confirmed
    # empirically, runs were landing 6-10 hours late at "0 2 * * *" -- that
    # exact-hour-boundary schedules queue behind heavy contention. Note:
    # this is a tighter margin than the previous 02:00 UTC schedule,
    # especially in winter (EST) where it's only ~11 minutes past the
    # 7:00 PM ET floor we originally targeted; if EODHD's post-close
    # update ever lags, push this later.
    - cron: "11 0 * * *"
  workflow_dispatch: {}

# GITHUB_TOKEN defaults to read-only contents access on many repos;
# explicitly grant write so the commit-back step below can push.
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (all active symbols, real Airtable writes)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python main.py --write

      # if: always() so this still runs (and commits whatever data was
      # successfully gathered) even if main.py exited non-zero because
      # some symbols errored -- see main.py's per-symbol error handling.
      # If main.py failed before ever regenerating the file, the
      # checked-out copy is unchanged and the diff check below is a
      # no-op, so this stays safe either way. The job's overall status
      # still reflects a failed "Run pipeline" step regardless.
      - name: Commit dashboard_data.json if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- dashboard_data.json; then
            echo "dashboard_data.json unchanged -- nothing to commit."
            exit 0
          fi

          git add dashboard_data.json
          git commit -m "Update dashboard_data.json [skip ci]"

          # Rebase onto the latest main in case anything else pushed
          # during the run, then push. Retry once after a re-pull if the
          # push is rejected, so a same-minute race doesn't fail the job.
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
