name: Daily Technical Dashboard Run

# Triggered ONLY by workflow_dispatch, not GitHub's own `schedule:` cron.
# GitHub's scheduled runs were empirically landing 7.5-12.5 hours late
# (deprioritized queue), so the daily trigger was moved to an external
# scheduler (a Make.com scenario) that calls this workflow's dispatch API
# at a fixed local time -- dispatched runs start immediately instead of
# queueing. See DEPLOYMENT.md Section 6. workflow_dispatch also still
# allows manual runs from the Actions tab / `gh workflow run`.
on:
  workflow_dispatch: {}

# GITHUB_TOKEN defaults to read-only contents access on many repos;
# explicitly grant write so the commit-back step below can push.
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (all active symbols, real Airtable writes)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python main.py --write

      # if: always() so this still runs (and commits whatever data was
      # successfully gathered) even if main.py exited non-zero because
      # some symbols errored -- see main.py's per-symbol error handling.
      # If main.py failed before ever regenerating these files, the
      # checked-out copies are unchanged and the status check below is a
      # no-op, so this stays safe either way. The job's overall status
      # still reflects a failed "Run pipeline" step regardless.
      - name: Commit dashboard_data.json and history_log.jsonl if they changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # history_log.jsonl doesn't exist in the repo at all until the
          # first successful run creates it, so `git status --porcelain`
          # (which covers untracked new files too) is used instead of
          # `git diff` (tracked-files-only) to catch that case.
          CHANGES="$(git status --porcelain -- dashboard_data.json history_log.jsonl)"
          if [ -z "$CHANGES" ]; then
            echo "No output files changed -- nothing to commit."
            exit 0
          fi

          git add dashboard_data.json
          if [ -f history_log.jsonl ]; then
            git add history_log.jsonl
          fi
          git commit -m "Update dashboard_data.json and history_log.jsonl [skip ci]"

          # Rebase onto the latest main in case anything else pushed
          # during the run, then push. Retry once after a re-pull if the
          # push is rejected, so a same-minute race doesn't fail the job.
          git pull --rebase origin main
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
